<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1118" />
    <title>occccad · CAD Workspace</title>
  </head>
  <body>
    <div id="app">
      <header class="appbar">
        <div class="brand"><span>occ</span>ccad</div>
        <nav class="menus"><button>文件</button><button>编辑</button><button>视图</button></nav>
        <div id="health" class="health waiting"><i></i>连接中</div>
      </header>

      <section class="commandbar">
        <div class="command-group">
          <button id="new-part" class="command primary"><b>＋</b><span>新建 Part</span></button>
          <button id="new-product" class="command"><b>▦</b><span>新建 Product</span></button>
        </div>
        <div class="command-group part-tools">
          <button id="start-sketch" class="command" disabled><b>✎</b><span>新建草图</span></button>
          <button id="exit-sketch" class="command hidden"><b>✓</b><span>退出草图</span></button>
          <button id="pad-sketch" class="command" disabled><b>↥</b><span>拉伸</span></button>
        </div>
        <div class="command-group product-tools">
          <button id="insert-document" class="command" disabled><b>⊕</b><span>插入文档</span></button>
          <button id="reference-mode" class="command" disabled><b>⛓</b><span>固定版本</span></button>
        </div>
        <div class="command-group history-tools">
          <button id="undo" class="command compact" disabled title="Ctrl+Z"><b>↶</b><span>Undo</span></button>
          <button id="redo" class="command compact" disabled title="Ctrl+Shift+Z"><b>↷</b><span>Redo</span></button>
        </div>
        <div class="command-group view-tools">
          <button id="fit-view" class="command compact" title="适配视图 (F)"><b>⌗</b><span>适配</span></button>
        </div>
        <div id="mode-label" class="mode-label">选择模式</div>
      </section>

      <section id="tabs" class="tabs"><div class="tabs-empty">打开或新建文档开始建模</div></section>

      <main class="workspace">
        <aside class="panel left-panel">
          <div class="panel-tabs"><button class="active">结构树</button><button>文档</button></div>
          <section class="browser-section">
            <div class="section-heading"><span>当前文档</span><button id="refresh-documents" title="刷新">↻</button></div>
            <div id="tree" class="tree empty">没有打开的文档</div>
          </section>
          <section class="browser-section documents-section">
            <div class="section-heading"><span>文档库</span></div>
            <div id="documents" class="documents empty">正在加载…</div>
          </section>
        </aside>

        <section class="viewport-shell">
          <div id="viewport"></div>
          <div class="view-cube">
            <button data-view="ISO" class="cube-corner" title="等轴测">◆</button>
            <button data-view="TOP" class="cube-top">TOP</button>
            <button data-view="FRONT" class="cube-front">FRONT</button>
            <button data-view="RIGHT" class="cube-right">RIGHT</button>
          </div>
          <div id="hint" class="viewport-hint">选择一个基准面，然后点击“新建草图”</div>
          <div class="statusbar">
            <span id="status">就绪</span>
            <span class="navigation-help">右键旋转 · 中键 / Ctrl+右键平移 · 滚轮缩放 · F 适配</span>
            <span>单位：mm</span>
          </div>
        </section>

        <aside class="panel inspector">
          <div class="panel-tabs"><button class="active">属性</button><button>历史</button></div>
          <section id="properties" class="properties empty">选择对象查看属性</section>
          <section class="history-summary">
            <div class="section-heading"><span>版本状态</span></div>
            <dl id="history-info"><div><dt>Version</dt><dd>—</dd></div></dl>
          </section>
        </aside>
      </main>
    </div>

    <dialog id="document-dialog">
      <form method="dialog">
        <header><h2>创建文档</h2><button value="cancel" aria-label="关闭">×</button></header>
        <input id="document-type" type="hidden" />
        <label>文档名称<input id="document-name" required maxlength="120" autocomplete="off" /></label>
        <footer><button value="cancel">取消</button><button id="confirm-document" value="default" class="primary">创建</button></footer>
      </form>
    </dialog>

    <dialog id="pad-dialog">
      <form method="dialog">
        <header><h2>拉伸草图</h2><button value="cancel" aria-label="关闭">×</button></header>
        <label>拉伸长度（mm）<input id="pad-length" type="number" min="0.1" step="1" value="40" required /></label>
        <footer><button value="cancel">取消</button><button id="confirm-pad" value="default" class="primary">确定</button></footer>
      </form>
    </dialog>

    <dialog id="insert-dialog">
      <form method="dialog">
        <header><h2>插入 Part / Product</h2><button value="cancel" aria-label="关闭">×</button></header>
        <label>引用文档<select id="insert-document-select" required></select></label>
        <label>实例名称<input id="instance-name" maxlength="120" autocomplete="off" /></label>
        <footer><button value="cancel">取消</button><button id="confirm-insert" value="default" class="primary">插入</button></footer>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
