syntax = "proto3";

package occccad.worker.v1;

option go_package = "github.com/occccad/occccad/gen/worker/v1;workerv1";

// ---------------------------------------------------------------------------
// Geometry Worker gRPC Service
//
// Phase 2+: Coarse-grained geometry operations.
// All operations use content-addressable GeometryId.
// No OCCT types are exposed in the protocol.

service GeometryWorker {
    // Health check
    rpc Ping(PingRequest) returns (PingResponse);

    // Evaluate one complete Part feature chain in a coarse-grained worker call.
    rpc EvaluatePart(EvaluatePartRequest) returns (EvaluatePartResponse);

    // Solve one immutable, domain-owned 2D sketch. PlaneGCS remains an
    // implementation detail of this coarse-grained boundary.
    rpc SolveSketch(SolveSketchRequest) returns (SolveSketchResponse);

    // Solve one immutable 3D assembly geometry-constraint system. Product
    // identity and persistence stay in the control plane; this boundary only
    // carries rigid poses, local geometric descriptors and residual equations.
    rpc SolveAssembly(SolveAssemblyRequest) returns (SolveAssemblyResponse);

    // Neutral CAD exchange uses immutable ArtifactReference values. Large file
    // bytes never cross this unary gRPC boundary.
    rpc InspectExchange(InspectExchangeRequest) returns (InspectExchangeResponse);
    rpc ImportExchange(ImportExchangeRequest) returns (EvaluatePartResponse);
    rpc ExportExchange(ExportExchangeRequest) returns (ExportExchangeResponse);

    // Load geometry from B-Rep artifact
    rpc LoadGeometry(LoadGeometryRequest) returns (LoadGeometryResponse);

    // Unload geometry
    rpc UnloadGeometry(UnloadGeometryRequest) returns (UnloadGeometryResponse);

    // Query topology
    rpc GetTopology(GetTopologyRequest) returns (GetTopologyResponse);

    // Tessellate
    rpc Tessellate(TessellateRequest) returns (TessellateResponse);

    // Feature operations
    rpc CreateChamfer(CreateChamferRequest) returns (CreateChamferResponse);
    rpc CreateFillet(CreateFilletRequest) returns (CreateFilletResponse);
}

message Vec2 {
    double x = 1;
    double y = 2;
}

message Quaternion {
    double x = 1;
    double y = 2;
    double z = 3;
    double w = 4;
}

message RigidPose {
    Vec3 translation = 1;
    Quaternion rotation = 2;
}

message AssemblyBody {
    string id = 1;
    RigidPose initial_pose = 2;
}

message AssemblyGeometry {
    string id = 1;
    string body_id = 2;
    string kind = 3; // POINT, AXIS, PLANE, CYLINDER
    Vec3 origin = 4;
    Vec3 direction = 5;
    double radius = 6;
}

message AssemblyGeometryRef {
    string body_id = 1;
    string geometry_id = 2;
}

message AssemblyConstraint {
    string id = 1;
    string kind = 2; // FIX, COINCIDENT, CONCENTRIC, ANGLE, DISTANCE
    AssemblyGeometryRef first = 3;
    AssemblyGeometryRef second = 4;
    double value = 5;
    string direction_relation = 6; // UNORIENTED, SAME, OPPOSITE
    string distance_relation = 7; // UNSIGNED, ALONG_SECOND_NORMAL, OPPOSITE_SECOND_NORMAL
    RigidPose fixed_pose = 8;
    string connection_id = 9;
    string mode = 10; // DRIVING, MEASURED, CONTROLLED, SUPPRESSED
    Vec3 angle_reference_direction = 11; // optional, in second-body local coordinates
    AssemblyAngleBranchState angle_branch_state = 12; // optional previous accepted branch
}

message SolveAssemblyRequest {
    string request_id = 1;
    repeated AssemblyBody bodies = 2;
    repeated AssemblyGeometry geometry = 3;
    repeated AssemblyConstraint constraints = 4;
    double length_scale = 5;
    double angle_scale = 6;
    reserved 7;
    repeated string affected_body_ids = 8;
    AssemblySolveIntent solve_intent = 9;
    AssemblySolverProfile solver_profile = 10;
}

message AssemblyConstraintResidual {
    string constraint_id = 1;
    double normalized_norm = 2;
}

message SolvedAssemblyBody {
    string id = 1;
    RigidPose pose = 2;
}

message SolveAssemblyResponse {
    string status = 1; // CONVERGED, UNSATISFIED, INCONSISTENT, MAX_ITERATIONS, INVALID_MODEL, NUMERICAL_FAILURE
    repeated SolvedAssemblyBody bodies = 2;
    repeated AssemblyConstraintResidual residuals = 3;
    uint64 iterations = 4;
    double normalized_residual = 5;
    string diagnostic = 6;
    string classification = 7;
    repeated AssemblyEquationResidual equation_residuals = 8;
    repeated AssemblyComponentDof components = 9;
    repeated string redundant_constraint_ids = 10;
    repeated string conflicting_constraint_ids = 11;
    repeated AssemblySolveDiagnostic diagnostics = 12;
    repeated string unsatisfied_constraint_ids = 13;
    repeated AssemblyConstraintRankInfo constraint_ranks = 14;
    repeated AssemblySolvedAngleBranch angle_branches = 15;
    repeated string suspected_conflicting_constraint_ids = 16;
}

message SketchPoint {
    string id = 1;
    Vec2 point = 2;
    string role = 3;
}

message SketchLine {
    string id = 1;
    Vec2 start = 2;
    Vec2 end = 3;
    string role = 4;
}

message SketchCircle {
    string id = 1;
    Vec2 center = 2;
    double radius = 3;
    string role = 4;
}

message SketchArc {
    string id = 1;
    Vec2 center = 2;
    double radius = 3;
    double start_angle = 4;
    double end_angle = 5;
    string role = 6;
}

message SketchSpline {
    string id = 1;
    repeated Vec2 control_points = 2;
    uint32 degree = 3;
    bool closed = 4;
    string role = 5;
}

message SketchGeometryRef {
    // ENTITY, SKETCH_ORIGIN, SKETCH_X_AXIS, or SKETCH_Y_AXIS.
    string target = 1;
    string entity_id = 2;
    // WHOLE, POINT, START, END, CENTER, DIRECTION, or CONTROL.
    string sub_element = 3;
    uint32 control_point_index = 4;
}

message SketchConstraint {
    string id = 1;
    // Versioned domain kind such as COINCIDENT, PARALLEL, FIXED,
    // HORIZONTAL, VERTICAL, PERPENDICULAR, TANGENT, EQUAL, DISTANCE,
    // LENGTH, RADIUS, DIAMETER, ANGLE, CONCENTRIC, POINT_ON_OBJECT, MIDPOINT.
    string kind = 2;
    repeated SketchGeometryRef references = 3;
    Vec2 fixed_point = 4;
    double value = 5;
    string unit = 6;
    bool internal = 7;
}

message SketchModel {
    uint32 schema_version = 1;
    repeated SketchPoint points = 2;
    repeated SketchLine lines = 3;
    repeated SketchConstraint constraints = 4;
    repeated SketchCircle circles = 5;
    repeated SketchArc arcs = 6;
    repeated SketchSpline splines = 7;
}

message SolveSketchRequest {
    string request_id = 1;
    SketchModel sketch = 2;
}

message SolveSketchResponse {
    SketchModel sketch = 1;
    // SOLVED, UNDER_CONSTRAINED, INVALID_MODEL, REDUNDANT, CONFLICTING, FAILED.
    string status = 2;
    int32 degrees_of_freedom = 3;
    repeated string conflicting_constraint_ids = 4;
    repeated string redundant_constraint_ids = 5;
    string diagnostic = 6;
}

message EvaluatePartRequest {
    string request_id = 1;
    string geometry_key = 2;
    RectangularPadSpec rectangular_pad = 3;
    double linear_deflection = 4;
    double angular_deflection = 5;
    repeated RectangularPadSpec rectangular_pads = 6;
    bytes base_brep_data = 7;
    ArtifactReference base_brep_artifact = 8;
    string brep_output_key = 9;
    string glb_output_key = 10;
    repeated ProfilePadSpec profile_pads = 11;
}

message ProfileCurve {
    string entity_id = 1;
    bool reversed = 2;
    string kind = 3; // LINE | CIRCLE | ARC | SPLINE
    Vec2 start = 4;
    Vec2 end = 5;
    Vec2 center = 6;
    double radius = 7;
    double start_angle = 8;
    double end_angle = 9;
    repeated Vec2 control_points = 10;
    uint32 degree = 11;
    bool closed = 12;
}

message ProfileLoop {
    string id = 1;
    repeated ProfileCurve curves = 2;
}

message ProfileRegion {
    string id = 1;
    ProfileLoop outer = 2;
    repeated ProfileLoop holes = 3;
}

message ProfilePadSpec {
    repeated ProfileRegion regions = 1;
    double pad_length = 2;
    string units = 3;
    string plane = 4;
    // NEW_BODY | ADD | REMOVE | INTERSECT. Legacy senders default to ADD.
    string body_operation = 5;
    // LINEAR_EXTRUDE | REVOLVE. Legacy senders default to LINEAR_EXTRUDE.
    string generator = 6;
    double revolve_angle = 7; // radians, ignored by LINEAR_EXTRUDE
    Vec2 axis_start = 8;      // sketch-local, required by REVOLVE
    Vec2 axis_end = 9;
    bool reversed = 10;
    // Explicit sketch support frame. Zero normal keeps legacy XY/XZ/YZ mapping.
    Vec3 plane_origin = 11;
    Vec3 plane_normal = 12;
    Vec3 plane_u_direction = 13;
}

message ArtifactReference {
    // LOCAL is the current development backend. HTTPS/S3 references can be
    // added without exposing an operating-system path to the protocol.
    string backend = 1;
    string object_key = 2;
    string sha256 = 3;
    uint64 size_bytes = 4;
    string content_type = 5;
}

message InspectExchangeRequest {
    string request_id = 1;
    string format = 2; // STEP | BREP
    ArtifactReference source = 3;
}

message ExchangeComponentInfo {
    uint32 source_index = 1;
    string name = 2;
}

message InspectExchangeResponse {
    // PART for one transferable root; PRODUCT when roots can be evaluated in
    // parallel and assembled as referenced Part documents.
    string document_type = 1;
    repeated ExchangeComponentInfo components = 2;
}

message ImportExchangeRequest {
    string request_id = 1;
    string geometry_key = 2;
    string format = 3;
    ArtifactReference source = 4;
    uint32 source_index = 5;
    string brep_output_key = 6;
    string glb_output_key = 7;
    double linear_deflection = 8;
    double angular_deflection = 9;
}

message ExchangeComponent {
    string name = 1;
    ArtifactReference brep = 2;
    Vec3 translation = 3;
}

message ExportExchangeRequest {
    string request_id = 1;
    string format = 2; // STEP | BREP
    repeated ExchangeComponent components = 3;
    string output_key = 4;
}

message ExportExchangeResponse {
    ArtifactReference result = 1;
}

message RectangularPadSpec {
    double origin_x = 1;
    double origin_y = 2;
    double width = 3;
    double height = 4;
    double pad_length = 5;
    string units = 6;
    string plane = 7;
}

message EvaluatePartResponse {
    string geometry_id = 1;
    string geometry_key = 2;
    bytes brep_data = 3;
    Mesh mesh = 4;
    BoundingBox bbox = 5;
    TopologySummary topology = 6;
    double volume = 7;
    bool cache_hit = 8;
    string occt_version = 9;
    bytes glb_data = 10;
    ArtifactReference brep_artifact = 11;
    ArtifactReference glb_artifact = 12;
}

message Mesh {
    repeated Vec3 vertices = 1;
    repeated Triangle triangles = 2;
    repeated uint32 face_ids = 3;
    repeated EdgePolyline edges = 4;
    repeated TopologyPoint topology_vertices = 5;
}

message EdgePolyline {
    uint64 local_id = 1;
    repeated Vec3 points = 2;
}

message TopologyPoint {
    uint64 local_id = 1;
    Vec3 point = 2;
}

message Triangle {
    uint32 v0 = 1;
    uint32 v1 = 2;
    uint32 v2 = 3;
}

message TopologySummary {
    uint32 face_count = 1;
    uint32 edge_count = 2;
    uint32 vertex_count = 3;
    uint32 solid_count = 4;
}

// ---------------------------------------------------------------------------
// Ping
// ---------------------------------------------------------------------------

message PingRequest {}

message PingResponse {
    string worker_id = 1;
    string occt_version = 2;
    uint32 resident_geometry_count = 3;
}

// ---------------------------------------------------------------------------
// Load / Unload
// ---------------------------------------------------------------------------

message LoadGeometryRequest {
    bytes brep_data = 1;
}

message LoadGeometryResponse {
    string geometry_id = 1;
    BoundingBox bbox = 2;
    uint32 face_count = 3;
    uint32 edge_count = 4;
}

message UnloadGeometryRequest {
    string geometry_id = 1;
}

message UnloadGeometryResponse {}

// ---------------------------------------------------------------------------
// Topology
// ---------------------------------------------------------------------------

message GetTopologyRequest {
    string geometry_id = 1;
    bytes brep_data = 2;
    string topology_type = 3;
    uint64 local_id = 4;
    ArtifactReference brep_artifact = 5;
}

message GetTopologyResponse {
    uint32 face_count = 1;
    uint32 edge_count = 2;
    uint32 vertex_count = 3;
    uint32 solid_count = 4;
    repeated FaceInfo faces = 5;
    repeated EdgeInfo edges = 6;
    repeated VertexInfo vertices = 7;
}

message TopologyProperty {
    string name = 1;
    oneof value {
        double number_value = 2;
        int64 integer_value = 3;
        bool bool_value = 4;
        string text_value = 5;
        Vec3 vector_value = 6;
    }
}

message FaceInfo {
    uint64 local_id = 1;
    int32 surface_type = 2;
    BoundingBox bbox = 3;
    repeated TopologyProperty properties = 4;
}

message EdgeInfo {
    uint64 local_id = 1;
    int32 curve_type = 2;
    BoundingBox bbox = 3;
    repeated TopologyProperty properties = 4;
    repeated Vec3 render_points = 5;
}

message VertexInfo {
    uint64 local_id = 1;
    Vec3 point = 2;
    repeated TopologyProperty properties = 3;
}

// ---------------------------------------------------------------------------
// Tessellation
// ---------------------------------------------------------------------------

message TessellateRequest {
    string geometry_id = 1;
    double linear_deflection = 2;
    double angular_deflection = 3;
}

message TessellateResponse {
    bytes glb_data = 1;
    bytes topology_pb = 2;
    bytes edge_data = 3;
}

// ---------------------------------------------------------------------------
// Features
// ---------------------------------------------------------------------------

message CreateChamferRequest {
    string geometry_id = 1;
    repeated uint64 edge_local_ids = 2;
    double distance = 3;
}

message CreateChamferResponse {
    string new_geometry_id = 1;
}

message CreateFilletRequest {
    string geometry_id = 1;
    repeated uint64 edge_local_ids = 2;
    double radius = 3;
}

message CreateFilletResponse {
    string new_geometry_id = 1;
}

// ---------------------------------------------------------------------------
// Common
// ---------------------------------------------------------------------------

message BoundingBox {
    double min_x = 1;
    double min_y = 2;
    double min_z = 3;
    double max_x = 4;
    double max_y = 5;
    double max_z = 6;
}

message Vec3 {
    double x = 1;
    double y = 2;
    double z = 3;
}

// Assembly M1 diagnostics are appended to keep existing message descriptor
// indices stable while SolveAssemblyResponse references them by name.
message AssemblyEquationResidual {
    string equation_id = 1;
    string connection_id = 2;
    string constraint_id = 3;
    uint64 equation_index = 4;
    double normalized_value = 5;
}

message AssemblyComponentDof {
    string component_id = 1;
    repeated string body_ids = 2;
    uint64 tangent_variable_count = 3;
    uint64 jacobian_rank = 4;
    uint64 relative_dof = 5;
    uint64 gauge_dof = 6;
    bool solved = 7;
    repeated string tangent_cluster_ids = 8;
    repeated AssemblyTangentVector null_space_basis = 9;
    repeated double singular_values = 10;
    double rank_threshold = 11;
}

message AssemblyTangentVector {
    repeated double values = 1; // [tx,ty,tz,rx,ry,rz] per tangent_cluster_ids entry
}

message AssemblySolveDiagnostic {
    string code = 1;
    string component_id = 2;
    repeated string body_ids = 3;
    repeated string constraint_ids = 4;
    string detail = 5;
}

message AssemblySolveIntent {
    repeated string moving_body_ids = 1;
    repeated string reference_body_ids = 2;
    string preference_policy = 3; // MINIMUM_TOTAL_CHANGE, MOVE_FIRST_MINIMIZE_REFERENCE
}

message AssemblyAngleBranchState {
    double wrapped_angle = 1;
    double unwrapped_angle = 2;
    int64 winding = 3;
}

message AssemblySolvedAngleBranch {
    string constraint_id = 1;
    AssemblyAngleBranchState state = 2;
}

message AssemblyConstraintRankInfo {
    string constraint_id = 1;
    uint64 equation_count = 2;
    uint64 effective_rank = 3;
    uint64 incremental_rank = 4;
    string role = 5; // INDEPENDENT, PARTIALLY_REDUNDANT, FULLY_REDUNDANT
    uint64 declared_generic_rank = 6;
}

message AssemblySolverProfile {
    uint32 schema_version = 1;
    uint64 max_iterations = 2;
    double length_tolerance = 3;
    double angle_tolerance = 4;
    double classification_length_tolerance = 5;
    double classification_angle_tolerance = 6;
    double translation_step_tolerance = 7;
    double rotation_step_tolerance = 8;
    double degeneracy_tolerance = 9;
    double finite_difference_step = 10;
    double initial_damping = 11;
    double rank_tolerance = 12;
    double translation_finite_difference_step = 13;
    double rotation_finite_difference_step = 14;
    double rank_absolute_tolerance = 15;
    double rank_relative_tolerance = 16;
    double gradient_tolerance = 17;
    double moving_preference_weight = 18;
    double neutral_preference_weight = 19;
    double reference_preference_weight = 20;
    uint64 max_conflict_probes = 21;
    bool verify_analytic_jacobians = 22;
    double jacobian_check_tolerance = 23;
}
