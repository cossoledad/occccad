min_version = "2026.8.3"

[tools]
go = "1.26.5"
node = "26.7.0"
python = "3.14.7"
uv = "0.8.17"
"npm:pnpm" = "11.20.0"
# Conan alone uses Python; project orchestration has no Python runtime.
"pipx:conan" = "2.31.2"
cmake = "4.2.3"
ninja = "1.13.2"
ccache = "4.12.3"
protoc = "27.0"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.6"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "1.5.1"

[settings]
experimental = true
lockfile = true
jobs = 1

[settings.task]
run_auto_install = false

[task_config]
includes = ["dev/tasks"]
